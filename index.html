<body onload="startGameIdentif()">
    <header>

        <div style="display: flex;">
            <h1>IDENTIF' GAME</h1>
        </div>

        <button id ="openButton" onclick="openNav()">☰ LISTE VEHICULES</button>
        <button onclick="loadImage()">▶ JOUER !</button>
    </header>
    <div id="mySidenav" class="sidenav">
        <button style="display:block;margin-left: auto;margin-right: auto;"
            onclick="uncheck_all()">Tout
            Décocher</button>
        <button style="display:block;margin-left: auto;margin-right: auto;"
            onclick="check_all()">Tout
            cocher</button>
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
        <ul id="tankslist">
        </ul>
    </div>
    <!-- navbar -->
    <main id="main">
        <div class="card">
            <div class="card__inner">
                <div class="card__face card__face--front">
                    <img id="test" src="./img/logo.svg"></img>
                </div>
                <div class="card__face card__face--back">
                    <div class="card__content">
                        <div class="card__header">
                            <h2>Réponse</h2>
                        </div>
                        <div class="card__body">
                            <h3 id="answer"></h3>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <br>
        <button  id="okbutton" onclick="loadImage()">OK</button>
    </main>
